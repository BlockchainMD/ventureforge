# Land Alpha, locally.
#
# The whole product, no toolchain required beyond Docker:
#
#   docker compose --profile app up --build      http://localhost:3000
#
# That starts Postgres/PostGIS, applies migrations, seeds the demo data and
# serves a production build. Sign in as analyst@landalpha.local / landalpha-dev.
#
# For development against the source instead, run only the dependencies and use
# your own toolchain:
#
#   docker compose up -d          Postgres/PostGIS
#   pnpm setup                    migrate + seed
#   pnpm dev                      the analyst terminal
#   pnpm worker                   the ingestion/enrichment worker
#
# Redis and MinIO are optional: the default queue is Postgres-backed and the
# default object store is the filesystem. They are here so production parity can
# be exercised locally when you want it.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: land-alpha-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: landalpha
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d landalpha']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: land-alpha-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    profiles: ['full']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: land-alpha-minio
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: landalpha
      MINIO_ROOT_PASSWORD: landalpha-dev-secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    profiles: ['full']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: create the demo users and fixture parcels, then exit. Runs off
  # the build stage because seeding is a TypeScript script and the runtime image
  # deliberately carries no toolchain.
  seed:
    build:
      context: .
      target: build
      secrets: [ca_bundle]
    container_name: land-alpha-seed
    profiles: ['app']
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/landalpha?schema=public'
      INGEST_OFFLINE: 'true'
      # The seed creates demo users and fixture parcels, and the seeder refuses
      # to run against a production database — correctly. This is a development
      # seed of a local database, so it says so.
      NODE_ENV: 'development'
    command: ['sh', '-c', 'pnpm db:migrate && pnpm db:seed']
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  web:
    build:
      context: .
      target: runtime
      secrets: [ca_bundle]
    container_name: land-alpha-web
    profiles: ['app']
    environment:
      DATABASE_URL: 'postgresql://postgres:postgres@postgres:5432/landalpha?schema=public'
      # Local-only development secret. Generate a real one for anything else:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))"
      AUTH_SECRET: 'local-development-only-not-a-real-secret-32b'
      NODE_ENV: 'production'
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
    restart: unless-stopped

# Building behind a TLS-inspecting proxy: point CA_BUNDLE_FILE at the proxy's
# certificate and it is trusted for the dependency-install layer only, never
# copied into an image. Unset it and this is an empty file the build ignores.
secrets:
  ca_bundle:
    file: ${CA_BUNDLE_FILE:-/dev/null}

volumes:
  postgres-data:
  redis-data:
  minio-data:
